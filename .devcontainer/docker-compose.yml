services:
  gausseg:
    image: gausseg:latest
    container_name: gausseg
    init: true
    shm_size: '32gb'
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        TZ: ${TZ:-UTC}
        GIT_DELTA_VERSION: 0.18.2
    volumes:
      - ..:/workspace:delegated
      # Named volume, so the retrieval-model download survives rebuilds without
      # the compose file assuming anything about the host filesystem.
      - gausseg_hf_cache:/home/sandboxuser/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sleep infinity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  gausseg_hf_cache:

# config.yaml — all training parameters, single source of truth
# Relative paths resolve against this file's directory. Copy to config.local.yaml to tune per machine.

# --- DTU training data (MVSNet preprocessing) ---
data:
  dtu_root: data/dtu/mvs_training/dtu # holds Cameras/ (pair.txt, train/*_cam.txt) and Rectified/
  dtu_depths_raw: data/dtu/Depths_raw # 1600x1200 depth_map_*.pfm + depth_visual_*.png; logged metrics only, no loss reads them
  train_list: lists/dtu/train.txt # scans to train on, one per line (MVSNet split: 79 scans)
  num_view: 5 # reference + source views per sample (paper: N = 5)
  num_depth: 192 # depth hypotheses spanning the camera file's range at stage 1
  interval_scale: 1.06 # widens the hypothesis interval read from the camera files

# --- Cascade backbone (must match the inference config to reuse the checkpoint) ---
backbone:
  ndepths: "48,32,8" # depth hypotheses per cascade stage, coarse to fine
  depth_inter_r: "4,2,1" # hypothesis interval ratio per stage
  cr_base_chs: "8,8,8" # 3D CNN base channels per stage (paper: 8)

# --- Optimisation ---
train:
  log_dir: runs/gaus-mvsnet # train_log.csv and model_XXXXXX.ckpt go here
  epochs: 15
  lr: 0.0001 # Adam
  lr_epochs: "10,12,14" # epochs after which lr is divided by lr_divisor
  lr_divisor: 2.0
  warmup_iters: 500 # linear warm-up from lr/3 over the first iterations
  batch_size: 4
  num_workers: 4
  seed: 1
  max_steps: null # stop after this many iterations; null trains all epochs
  resume: null # checkpoint to continue from (model + optimizer + epoch)
  summary_freq: 10 # log every this many iterations

# --- Losses: L = w_pc * L_PC + w_rc * L_RC + w_dc * L_DC ---
loss:
  w_pc: 1.0 # cross-view photometric consistency
  w_rc: 0.9 # rendering consistency (3DGS branch)
  w_dc: 0.9 # depth consistency (3DGS branch)
  pc_norm: 12.0 # L_PC is divided by this: the reprojection term then weighs 1 and SSIM 0.5
  pc_stage_weights: "0.5,1.0,2.0" # L_PC weight per cascade stage
  ssim_lambda: 0.2 # D-SSIM share inside L_RC
  dc_unit: 300.0 # L_DC compares depths in this unit, given in mm
  dc_beta: 1.0 # Smooth-L1 beta of L_DC, in units of dc_unit
  aux_branch: true # false trains on L_PC alone

# --- Opacity fitted inside each batch, depth frozen ---
inner_loop:
  inner_steps: 10 # Adam steps per batch
  inner_lr: 0.5 # Adam learning rate of the opacity logits
  opacity_init: 0.1 # initial opacity of every Gaussian
